# Test renders of the event reels (Binnenkort, Deze week, Nieuw, single) with
# the atmosphere footage behind hook and call to action
# (lib/instagram/reel/backdrop.ts). Start by hand: Actions > "Instagram reel
# test" > Run workflow, or push a change to the reel code on a claude/ branch.
# Nothing is published; the videos, covers and captions are attached to the
# run as the artifact "event-reels". Without a database secret the mock
# catalog is used.
#
# Repository secrets: ANTHROPIC_API_KEY, PIXABAY_API_KEY (PEXELS_API_KEY
# optional); without them the reels render plain.
name: Instagram reel test

on:
  push:
    branches: ["claude/**"]
    paths:
      - "lib/instagram/reel/**"
      - "remotion/Reel.tsx"
      - "remotion/footage.tsx"
      - "scripts/render-test-reel.ts"
      - ".github/workflows/instagram-reel-test.yml"
  workflow_dispatch:
    inputs:
      format:
        description: "deze_week, binnenkort, nieuw, single (komma's), leeg = alle"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      FORMAT: ${{ inputs.format }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Pixabay asks to cache search results for 24 hours (lib/instagram/promo/stock.ts).
      - name: Stock search cache
        uses: actions/cache@v4
        with:
          path: .cache/promo-stock
          key: promo-stock-${{ github.run_id }}
          restore-keys: promo-stock-

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Render
        run: |
          args=(--out=out/reels)
          [ -n "$FORMAT" ] && args+=("--format=$FORMAT")
          npx tsx scripts/render-test-reel.ts "${args[@]}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: event-reels
          path: out/reels/
          if-no-files-found: warn
          retention-days: 14
