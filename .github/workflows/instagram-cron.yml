# Calls the Instagram queue every 15 minutes (Vercel Hobby crons run only daily).
# Needs repository secret CRON_SECRET (same value as CRON_SECRET in Vercel).
name: Instagram wachtrij

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: instagram-cron
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Instagram-wachtrij aanroepen
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL || 'https://dateofflinehub.be' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Repository secret CRON_SECRET ontbreekt."
            exit 1
          fi
          status=$(curl -sS -o response.json -w "%{http_code}" --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/instagram")
          cat response.json; echo
          test "$status" = "200"
