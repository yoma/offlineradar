# Render Instagram reels for the post queue (/interne-instagram/wachtrij).
# Every hour: ask the site whether reels are waiting; only then install
# Remotion and render. Upload goes back to the site (stored in Neon).
#
# Promo reels (docs/instagram-promo-reels.md) are planned here as well:
# Claude writes the text and picks stock clips before the render.
#
# Repository secrets: CRON_SECRET (same value as in Vercel); for promo reels
# ANTHROPIC_API_KEY and PIXABAY_API_KEY (PEXELS_API_KEY optional).
# Optional repository variable: REEL_SITE_URL (default https://dateofflinehub.be).
name: Instagram reels

on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:

concurrency:
  group: instagram-reels
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REEL_SITE_URL: ${{ vars.REEL_SITE_URL || 'https://dateofflinehub.be' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
    steps:
      - name: Check for waiting reels
        id: pending
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set as a repository secret." >&2
            exit 1
          fi
          body=$(curl -fsS --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$REEL_SITE_URL/api/instagram/reels/jobs")
          pending=$(echo "$body" | jq -r '.pending // 0')
          echo "Reels waiting: $pending"
          echo "count=$pending" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.pending.outputs.count != '0'

      - uses: actions/setup-node@v4
        if: steps.pending.outputs.count != '0'
        with:
          node-version: 22
          cache: npm

      # Pixabay asks to cache search results for 24 hours (lib/instagram/promo/stock.ts).
      - name: Stock search cache
        if: steps.pending.outputs.count != '0'
        uses: actions/cache@v4
        with:
          path: .cache/promo-stock
          key: promo-stock-${{ github.run_id }}
          restore-keys: promo-stock-

      - name: Install
        if: steps.pending.outputs.count != '0'
        run: npm ci --no-audit --no-fund

      - name: Render and upload
        if: steps.pending.outputs.count != '0'
        run: npx tsx scripts/render-queued-reels.ts
